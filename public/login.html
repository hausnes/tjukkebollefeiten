<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn – Svigerfars Slanke-OS</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-page">

        <header class="login-header">
            <p class="kicker">Prosjekt Svigerfit 2026</p>
            <p class="tagline">Kun for utvalgte. Du vet hvem du er.</p>
        </header>

        <div class="login-card">
            <div class="card-stripe"></div>
            <div class="card-body">
                <h1>Svigerfars<br>Slanke-OS</h1>
                <p class="login-subtitle">Logg inn for å følge reisen kilo for kilo.</p>

                <div id="errorMsg" class="login-error" hidden>
                    <span class="error-icon">!</span>
                    Feil passord. Prøv igjen.
                </div>

                <form class="login-form" method="post" action="/login">
                    <label for="passwordInput">Passord</label>
                    <input
                        id="passwordInput"
                        name="password"
                        type="password"
                        placeholder="Skriv inn passordet ditt"
                        autocomplete="current-password"
                        required
                        autofocus
                    >
                    <button type="submit">Gå inn i systemet →</button>
                </form>
            </div>
        </div>

        <footer class="login-footer">Svigerfars Slanke-OS &middot; 2026</footer>

    </div>

    <script>
        if (new URLSearchParams(location.search).get('feil') === '1') {
            document.getElementById('errorMsg').removeAttribute('hidden');
        }
    </script>
</body>
</html>
