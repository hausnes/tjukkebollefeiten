<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn – Slanke-OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/auth.css">
</head>
<body>
    <div class="login-page">
        <header class="login-header">
            <p class="kicker">Tjukkebollefeiten</p>
            <p class="tagline">Kilo for kilo, med humor og harde fakta.</p>
        </header>

        <div class="login-card">
            <div class="card-stripe"></div>
            <div class="card-body">
                <h1>Slanke-OS</h1>
                <p class="login-subtitle">Logg inn for å føre vekta di og følgje reisa di.</p>

                <div id="errorMsg" class="login-error" role="alert" hidden>
                    <span class="error-icon">!</span>
                    <span id="errorText"></span>
                </div>

                <form class="login-form" data-api="/api/logg-inn">
                    <div class="field">
                        <label class="field-label" for="username">Brukarnamn</label>
                        <input id="username" name="username" type="text" autocomplete="username"
                               autocapitalize="none" spellcheck="false" required autofocus>
                    </div>
                    <div class="field">
                        <label class="field-label" for="password">Passord</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit">Gå inn i systemet →</button>
                </form>

                <p class="login-alt">Har du fått ein invitasjonskode? <a href="/registrer">Lag ein brukar</a></p>
            </div>
        </div>

        <footer class="login-footer">Slanke-OS &middot; 2026</footer>
    </div>
    <script src="/auth.js"></script>
</body>
</html>
